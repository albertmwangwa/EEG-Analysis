<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Realtime Analysis</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
        .container { display: flex; gap: 20px; }
        .panel { background: #333; padding: 20px; border-radius: 8px; flex: 1; }
        img { width: 100%; max-width: 300px; border-radius: 4px; }
        h2 { margin-top: 0; }
        .stats { font-family: monospace; font-size: 1.2em; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .controls { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>EEG Topographic CNN - Realtime Analysis</h1>
    
    <div class="controls">
        <button id="toggleBtn" onclick="toggleRealtime()">Start Realtime</button>
    </div>

    <div class="container">
        <div class="panel">
            <h2>Input (Delta Band)</h2>
            <img id="inputImg" src="" alt="Waiting..." />
        </div>
        
        <div class="panel">
            <h2>Predictions</h2>
            <div id="predictions" class="stats">
                Waiting for data...
            </div>
        </div>
        
        <div class="panel">
            <h2>Explainability (Grad-CAM)</h2>
            <img id="explainImg" src="" alt="Explanation" />
            <p>Target: Task Head</p>
        </div>
    </div>

    <script>
        let intervalId = null;
        let isRunning = false;

        async function fetchSample() {
            try {
                // 1. Get Random Sample
                const res = await fetch('/api/random_sample');
                const data = await res.json();
                
                document.getElementById('inputImg').src = 'data:image/png;base64,' + data.image_base64;
                const imageId = data.image_id;
                
                // 2. Predict
                const predRes = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image_id: imageId})
                });
                const preds = await predRes.json();
                
                document.getElementById('predictions').innerHTML = `
                    <p>Shot (Good/Bad): ${preds.shot_prob.map(p => p.toFixed(2)).join(', ')}</p>
                    <p>Stress Level: ${preds.stress_val.toFixed(2)}</p>
                    <p>Task (3-Class): ${preds.task_prob.map(p => p.toFixed(2)).join(', ')}</p>
                `;
                
                // 3. Explain
                const expRes = await fetch('/api/explain', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({image_id: imageId, method: 'gradcam', head: 'task'})
                });
                const expData = await expRes.json();
                document.getElementById('explainImg').src = 'data:image/png;base64,' + expData.image_base64;
                
            } catch (e) {
                console.error(e);
            }
        }

        function toggleRealtime() {
            const btn = document.getElementById('toggleBtn');
            if (isRunning) {
                clearInterval(intervalId);
                btn.innerText = "Start Realtime";
                isRunning = false;
            } else {
                fetchSample(); // Run once immediately
                intervalId = setInterval(fetchSample, 2000); // Every 2 seconds
                btn.innerText = "Stop Realtime";
                isRunning = true;
            }
        }
    </script>
</body>
</html>
